services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Fake SMTP server for development (T15). Accepts every message and shows it
  # at http://localhost:8025 instead of delivering it, so working on the study
  # reminder never sends mail to a real address.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP — services point EMAIL_PROVIDER=smtp here
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500

  # rabbitmq intentionally omitted until events are wired (T04/T26) — add
  # a "rabbitmq: image: rabbitmq:3-management" service here when needed.

volumes:
  redis_data:
