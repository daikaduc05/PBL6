services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672"  # management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Fake SMTP server for development (T15). Accepts every message and shows it
  # at http://localhost:8025 instead of delivering it, so working on the study
  # reminder never sends mail to a real address.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP — services point EMAIL_PROVIDER=smtp here
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  redis_data:
  rabbitmq_data:
