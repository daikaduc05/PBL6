[project]
name = "pbl6-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/common", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (Depends(...) in a default arg) is FastAPI's own idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Every service's alembic/env.py has the same name and no shared package
# root (each service is its own project), so mypy sees two modules both
# called "env" the moment a second service gets a migration history —
# excluded rather than renamed, since the alembic CLI expects this exact
# layout and these scripts are boilerplate.
exclude = ["alembic/"]
