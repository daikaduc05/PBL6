[project]
name = "pbl6-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/common", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (Depends(...) in a default arg) is FastAPI's own idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
