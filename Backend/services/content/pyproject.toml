[project]
name = "content-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pbl6-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
]

[tool.uv.sources]
pbl6-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
