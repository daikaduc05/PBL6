[project]
name = "notification-service"
version = "0.1.0"
description = "PBL6 M2 — notifications (in-app, email, study reminder) and lesson recommendation"
requires-python = ">=3.12"
dependencies = [
    "pbl6-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    # zoneinfo ships no timezone database on Windows, so ZoneInfo("Asia/Ho_Chi_Minh")
    # raises ZoneInfoNotFoundError without this. The 20:00 cron (T14) needs it.
    "tzdata>=2026.4",
]

[project.optional-dependencies]
# Pulled in as the matching feature lands, so an unfinished feature never
# blocks `uv sync` for the rest of the team.
messaging = ["aio-pika>=9.4"]               # T16 event consumer
scheduling = ["apscheduler>=3.10"]          # T14 study-reminder cron
email = ["aiosmtplib>=3.0", "jinja2>=3.1"]  # T15 email channel

[tool.uv.sources]
pbl6-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
