[project]
name = "pbl6-notification"
version = "0.1.0"
description = "PBL6 M2 — notification service (in-app messages, email, study reminder, lesson recommendation)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
# Pulled in as the matching feature lands, so an unfinished feature never
# blocks `uv sync` for the rest of the team.
messaging = ["aio-pika>=9.4"]          # T16 event consumer
scheduling = ["apscheduler>=3.10"]     # T14 study-reminder cron
email = ["aiosmtplib>=3.0", "jinja2>=3.1"]  # T15 email channel
cache = ["redis>=5.2"]                 # reco cache

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
