<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <!--
    Inline styles and a table layout on purpose: Gmail strips <style> blocks
    and most clients ignore flexbox, so anything fancier renders unpredictably.
  -->
  <body style="margin: 0; padding: 0; background: #f4f5f7; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f5f7; padding: 24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; background: #ffffff; border-radius: 8px; padding: 32px;">
            <tr>
              <td>
                <h1 style="margin: 0 0 16px; font-size: 20px; color: #111827;">{{ heading }}</h1>
                {% block content %}{% endblock %}
                <p style="margin: 32px 0 0; font-size: 12px; color: #9ca3af;">
                  Bạn nhận được email này vì đang bật thông báo trên PBL6.
                  Có thể tắt trong phần Cài đặt thông báo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
