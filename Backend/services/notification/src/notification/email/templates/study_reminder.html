{% extends "base.html" %}

{% block content %}
<p style="margin: 0 0 12px; font-size: 15px; color: #374151; line-height: 1.6;">
  Chào {{ full_name }},
</p>
<p style="margin: 0 0 24px; font-size: 15px; color: #374151; line-height: 1.6;">
  Hôm nay bạn chưa hoàn thành bài học nào. Dành ra mười phút để giữ nhịp học
  đều đặn nhé — học ngắn mỗi ngày hiệu quả hơn học dồn cuối tuần.
</p>
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="background: #2563eb; border-radius: 6px;">
      <a href="{{ app_url }}/lessons"
         style="display: inline-block; padding: 12px 24px; font-size: 15px; color: #ffffff; text-decoration: none;">
        Vào học ngay
      </a>
    </td>
  </tr>
</table>
{% endblock %}
